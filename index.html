<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página Hola Mundo con despliegue continuo">
  <title>Hola Mundo | Despliegue Web</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem;
    }

    .container {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background-color: #0369a1;
      color: #e0f2fe;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 2.25rem;
      margin-bottom: 0.75rem;
      color: #38bdf8;
    }

    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: #4ade80;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <main class="container">
    <span class="badge">Deploy Activo</span>
    <h1>¡Hola Mundo!</h1>
    <p>Esta página web fue creada con HTML5 y CSS, y está conectada para desplegarse automáticamente ante cada cambio en el repositorio.</p>
    <div class="status">
      <span class="status-dot"></span>
      <span>Integración continua en funcionamiento</span>
    </div>
  </main>
</body>
</html>
